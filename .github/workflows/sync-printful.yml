name: Sync Printful Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Printful Catalog
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
        run: |
          python3 -c '
          import urllib.request
          import json
          import os

          url = "https://api.printful.com/store/products"
          headers = {
              "Authorization": f"Bearer {os.environ[\"PRINTFUL_API_KEY\"]}",
              "User-Agent": "Mozilla/5.0"
          }

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  data = json.loads(raw_data)
                  print("Full API Response:", json.dumps(data, indent=2))
                  
                  # Normalize result array safely
                  items = []
                  if isinstance(data.get("result"), list):
                      items = data["result"]
                  elif isinstance(data.get("result"), dict) and "data" in data["result"]:
                      items = data["result"]["data"]
                  
                  # Fallback payload wrapper format for the frontend client
                  output = {
                      "code": 200,
                      "result": items
                  }

                  with open("products.json", "w") as f:
                      json.dump(output, f, indent=2)
                  print(f"Successfully processed {len(items)} items into products.json")
          except Exception as e:
              print("Error fetching catalog:", e)
              exit(1)
          '

      - name: Commit and Push products.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync Printful product catalog"
          file_pattern: products.json
