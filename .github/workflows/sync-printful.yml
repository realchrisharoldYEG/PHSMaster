name: Sync Printful Catalog

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Printful Catalog
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
        run: |
          python3 -c '
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("PRINTFUL_API_KEY", "")
          store_id = os.environ.get("PRINTFUL_STORE_ID", "")
          
          print(f"Token length loaded: {len(token)}")
          print(f"Store ID loaded: {store_id}")
          
          if not token:
              print("ERROR: PRINTFUL_API_KEY environment variable is empty!")
              sys.exit(1)
          if not store_id:
              print("ERROR: PRINTFUL_STORE_ID environment variable is empty!")
              sys.exit(1)

          url = "https://api.printful.com/store/products"
          headers = {
              "Authorization": f"Bearer {token}",
              "X-PF-Store-Id": store_id,
              "User-Agent": "Mozilla/5.0"
          }

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  data = json.loads(raw_data)
                  
                  items = []
                  if isinstance(data.get("result"), list):
                      items = data["result"]
                  elif isinstance(data.get("result"), dict) and "data" in data["result"]:
                      items = data["result"]["data"]
                  
                  output = {
                      "code": 200,
                      "result": items
                  }

                  with open("products.json", "w") as f:
                      json.dump(output, f, indent=2)
                  print(f"Successfully processed {len(items)} items into products.json")
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"HTTP Error {e.code}: {error_body}")
              sys.exit(1)
          except Exception as e:
              print("Unexpected error fetching catalog:", e)
              sys.exit(1)
          '

      - name: Commit and Push products.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync Printful product catalog"
          file_pattern: products.json
          skip_ci: true
