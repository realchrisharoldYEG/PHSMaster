name: Sync Printful Catalog

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Printful Catalog
        env:
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
        run: |
          python3 -c '
          import urllib.request
          import json
          import os

          url = "https://api.printful.com/store/products"
          headers = {
              "Authorization": f"Bearer {os.environ[\"PRINTFUL_API_KEY\"]}",
              "User-Agent": "Mozilla/5.0"
          }

          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  print("API Response Received:", data)
                  with open("products.json", "w") as f:
                      json.dump(data, f, indent=2)
          except Exception as e:
              print("Error fetching catalog:", e)
              exit(1)
          '

      - name: Commit and Push products.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync Printful product catalog"
          file_pattern: products.json
