name: Sync Printful Catalog

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Printful Catalog
        run: |
          curl -X GET "https://api.printful.com/store/products" \
            -H "Authorization: Bearer ${{ secrets.PRINTFUL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -o products.json

      - name: Commit and Push Updated Catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync Printful product catalog [skip ci]"
          file_pattern: "products.json"
